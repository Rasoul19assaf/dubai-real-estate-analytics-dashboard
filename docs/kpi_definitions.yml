# Single source of truth for KPI definitions.
# docs/KPI_CATALOGUE.md and the dashboard's "KPI definitions" tab are generated
# from this file; Lightdash metrics in models/schema.yml point back here by kpi_id.
# Owners are PROPOSED roles for a property-investment platform, to be confirmed.

defaults:
  refresh: Weekly (DLD publishes daily; weekly is enough for acquisition decisions)
  data_owner: Ops Excellence (pipeline, definitions, data quality)

kpis:
  - id: K01
    name: Valid sales
    question: How much buying activity is there?
    definition: Number of distinct arm's-length residential sales that pass the validity rules.
    formula: COUNT(DISTINCT transaction_number) WHERE is_valid = 1
    model: fct_sales
    unit: count
    business_owner: Acquisitions
    caveats: Residential freehold units only. Excludes mortgages, gifts, lease-to-own, developer registrations, land and commercial units. Raw DLD row counts are far higher (see the data-quality report).

  - id: K02
    name: Sales value
    question: How much money changed hands?
    definition: Sum of sale prices of valid sales.
    formula: SUM(amount_aed) WHERE is_valid = 1
    model: fct_sales
    unit: AED
    business_owner: Acquisitions
    caveats: Never sum the raw Amount column; it mixes loan amounts and repeats portfolio-mortgage totals per unit.

  - id: K03
    name: Median sale price
    question: What does a typical unit cost?
    definition: Median sale price of valid sales in the segment.
    formula: MEDIAN(amount_aed) WHERE is_valid = 1
    model: fct_sales / mart_area_segment_kpis
    unit: AED
    business_owner: Acquisitions
    caveats: Depends on unit-size mix; compare within the same unit class and bedroom count.

  - id: K04
    name: Median price per sqm
    question: Is this area expensive for what you get?
    definition: Median of sale price divided by transaction size (sqm).
    formula: MEDIAN(amount_aed / transaction_size_sqm) WHERE is_valid = 1
    model: fct_sales / mart_area_segment_kpis
    unit: AED per sqm
    business_owner: Acquisitions
    caveats: Median, not mean, so a handful of ultra-prime sales can't move an area figure.

  - id: K05
    name: Off-plan premium
    question: How much more does off-plan cost than ready?
    definition: Median off-plan price per sqm divided by median ready price per sqm, minus 1.
    formula: MEDIAN(psm | off-plan) / MEDIAN(psm | ready) - 1
    model: mart_monthly_market
    unit: percent
    business_owner: Acquisitions
    caveats: Market-wide figure mixes different areas and projects; not a like-for-like premium.

  - id: K06
    name: Off-plan share
    question: How much of the activity is off-plan?
    definition: Share of valid sales registered as off-plan.
    formula: AVG(is_off_plan) WHERE is_valid = 1
    model: fct_sales / mart_area_segment_kpis
    unit: percent
    business_owner: Acquisitions
    caveats: ""

  - id: K07
    name: Liquidity (sales per month)
    question: If we buy here, how easily could a unit be sold again?
    definition: Valid sales per month in the segment; the ready-only version measures the resale market.
    formula: COUNT(valid sales) / months_in_period   (ready_sales_per_month uses is_off_plan = 0)
    model: mart_area_unit_kpis / mart_area_segment_kpis
    unit: sales per month
    business_owner: Acquisitions
    caveats: A volume proxy. True time-to-sell needs listing data (days on market), which DLD does not publish.

  - id: K08
    name: Median annual rent
    question: What rent does a typical unit earn?
    definition: Median DLD-annualised rent of valid single-unit residential Ejari contracts.
    formula: MEDIAN(annual_rent_aed) WHERE is_valid = 1
    model: fct_rent_contracts / mart_area_unit_kpis
    unit: AED per year
    business_owner: Property / Asset management
    caveats: Includes new and renewed contracts; renewals lag the market when rents are rising.

  - id: K09
    name: Median rent per sqm
    question: Rent normalised for unit size.
    definition: Median of annual rent divided by property size (sqm).
    formula: MEDIAN(annual_rent_aed / property_size_sqm) WHERE is_valid = 1
    model: fct_rent_contracts / mart_area_unit_kpis
    unit: AED per sqm per year
    business_owner: Property / Asset management
    caveats: ""

  - id: K10
    name: Gross rental yield
    question: What return before costs should we expect if we buy here?
    definition: Median rent per sqm divided by median READY sale price per sqm, for the same area and unit class.
    formula: median_rent_per_sqm / median_ready_price_per_sqm   (gross_yield_new_leases uses new contracts only)
    model: mart_area_unit_kpis
    unit: percent per year
    business_owner: Acquisitions
    caveats: Gross; before service charges, vacancy, management fees and DLD fees. Not by bedroom, because the Ejari export has no room count for most flats; per-sqm values keep unit size from biasing it. Includes renewals, which lag market rents; compare with the new-leases version. Shown only when both samples reach min_sample_indicative.

  - id: K11
    name: Yield confidence
    question: Can we trust this yield figure?
    definition: Reliable if the smaller of (ready sales, rent contracts) >= min_sample_reliable; Indicative if >= min_sample_indicative; otherwise Insufficient data.
    formula: CASE on LEAST(ready_sales_count, rent_contracts)
    model: mart_area_unit_kpis
    unit: label
    business_owner: Ops Excellence
    caveats: Thresholds in dbt_project.yml vars.

  - id: K12
    name: Valid-sale rate
    question: How much of the source data can we use?
    definition: Valid sales as a share of all rows in the DLD extract.
    formula: COUNT(fct_sales WHERE is_valid = 1) / COUNT(stg_dld_transactions)
    model: mart_monthly_market
    unit: percent
    business_owner: Ops Excellence
    caveats: A pipeline-health KPI. A sudden drop usually means the export settings or source format changed.

  - id: K14
    name: Area match rate
    question: How much of the sales market can be compared with rents?
    definition: Share of valid sales whose area is a DLD land area or is linked to one by the area crosswalk.
    formula: COUNT(valid sales WHERE area_mapping_status IN (land_area, project_crosswalk)) / COUNT(valid sales)
    model: fct_sales + seeds/area_name_map.csv
    unit: percent
    business_owner: Ops Excellence
    caveats: Sales and rents name areas at different levels (community vs DLD land area). On name alone the match rate is under half.

  - id: K13
    name: Open data incidents
    question: Is anything blocking correct numbers right now?
    definition: Number of data-quality checks with status FAIL on the latest refresh.
    formula: COUNT(dq_results WHERE status = 'FAIL')
    model: dq_results
    unit: count
    business_owner: Ops Excellence
    caveats: Target is 0 before any KPI is shared outside the team.
